<!DOCTYPE html>
<html lang="vi">

                <strong>08:00 - 12:00: Tập huấn quy trình làm việc mới (Kéo dài cả buổi sáng)</strong>

        </tr>
        <tr>
            <td>14:00 - 16:00</td>

        </tr>
